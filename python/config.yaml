# --- URL per anno: elenco partiti ammessi e codici da dichiarazione ---
# Fonte: Agenzia delle Entrate, tabella PDF "Partiti politici ammessi al
# beneficio della destinazione volontaria del due per mille dell'Irpef",
# pubblicata in allegato alle istruzioni dei modelli Redditi PF e 730.
# Sono link diretti a PDF: fetch_source_file() li scarica subito, senza
# scansionare una pagina HTML. Il parsing del PDF (due colonne: denominazione
# + codice) va verificato per ciascun anno con:
#   python acquire_party_codes.py --anni <ANNO>
#
# ATTENZIONE — 2016 e 2020 puntano allo STESSO file (.../0cddc6ef-4211-bd86-
# d704-751e0c7cd244): non è stato verificato se è corretto (l'AdE potrebbe
