# ============================================================================
# 2x1000 — Configurazione pipeline Python di acquisizione dati
# ============================================================================
# Modifica questi valori senza toccare il codice Python.
# Se questo file non esiste o una chiave manca, gli script usano i default
# interni (e semplicemente non scaricano nulla finché un URL non è configurato).
# Richiede PyYAML (pip install pyyaml); senza, funziona lo stesso con i default.
# ============================================================================

download:
  timeout_pagina: 60
  timeout_file: 120
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# --- URL per anno: risultati annuali del 2x1000 ai partiti politici ---
# Fonte: Dipartimento delle Finanze, portale "Analisi statistiche - Due per
# mille" (https://www1.finanze.gov.it/finanze/2xmille/public/index.php).
# Il portale è organizzato ad albero con un nodo per anno (parametro "tree",
# prefisso = anno + suffisso fisso "AADUEXM0101"). Il parametro "export"
# seleziona il formato della risposta: export=1 → PDF, export=2 → Excel,
# export=3 → CSV (verificato in produzione sul 2022: la risposta con export=3
# ha Content-Type non-HTML e viene salvata direttamente come file, senza
# bisogno di scansionare una pagina). Il prefisso "tree" per gli anni diversi
# dal 2022 non è ancora stato verificato scaricandolo — testa ogni anno con:
#   python acquire_results.py --anni <ANNO>
# e controlla data/processed/mef_results_<ANNO>.csv prima di fidartene per un
# import massivo. Se un anno non funziona, scarica a mano dal portale
# (aprendolo nel browser, navigando l'albero) e salvalo in data/raw/<anno>/,
# poi esegui con --no-download.
url_anni_risultati:
  2025: "https://www1.finanze.gov.it/finanze/2xmille/public/index.php?tree=2025AADUEXM0101&page=1&export=3&aggiornato=1522252800"
  2024: "https://www1.finanze.gov.it/finanze/2xmille/public/index.php?tree=2024AADUEXM0101&page=1&export=3&aggiornato=1522252800"
