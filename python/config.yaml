# --- Pipeline (pipeline.py) ---
pipeline:
  php_binary: "php"      # eseguibile PHP per gli step indicators/export
  step_timeouts:
    acquire_results: 1800
    acquire_codes: 1800
    acquire_geo: 1800
    db: 900
    indicators: 300
    export: 300
